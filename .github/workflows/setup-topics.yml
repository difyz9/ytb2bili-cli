# 将仓库 Topics 版本化：推送到本文件即自动应用。
# 也可在 Actions 页面手动 Run workflow。
# 想改 Topics：编辑下面 names 列表后提交本文件即可。
name: Setup Topics

on:
  push:
    paths: ['.github/workflows/setup-topics.yml']
  workflow_dispatch:

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - name: Apply repository topics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/topics" \
            -H "Accept: application/vnd.github+json" \
            -f 'names[]=youtube' \
            -f 'names[]=bilibili' \
            -f 'names[]=yt-dlp' \
            -f 'names[]=golang' \
            -f 'names[]=cli' \
            -f 'names[]=video-downloader' \
            -f 'names[]=whisper' \
            -f 'names[]=speech-to-text' \
            -f 'names[]=text-to-speech' \
            -f 'names[]=tts' \
            -f 'names[]=subtitle' \
            -f 'names[]=translation' \
            -f 'names[]=automation' \
            -f 'names[]=pipeline' \
            -f 'names[]=video-processing' \
            -f 'names[]=ffmpeg' \
            -f 'names[]=deepseek' \
            -f 'names[]=daemon' \
            -f 'names[]=content-creation' \
            -f 'names[]=indextts'
          echo "Topics applied."
