name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # 允许创建 GitHub Release 并上传 assets

env:
  GOPROXY: https://goproxy.cn,direct

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser 需要完整 git 历史生成 changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # 从 go.mod 中读取 Go 版本
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2" # 与 .goreleaser.yaml 中 version: 2 保持一致
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
