# ============================================================
# 付费文档分析 — SkillHub Pay Skill 配置
# ============================================================
name: pay-doc-analyzer
display_name: "付费文档分析"
description: "对文档（EPUB/TXT）进行智能分析，提取关键信息和摘要。每次调用 ¥0.50，支持微信 AI 专属卡支付。"
version: "1.0.0"
category: 工具
platforms:
  - workbuddy
  - qclaw
  - claude-code

author:
  name: "商户名称"
  email: "merchant@example.com"

# ---- 触发关键词 ----
triggers:
  - keyword: "分析文档"
    match: fuzzy
  - keyword: "付费分析"
    match: fuzzy
  - keyword: "文档分析"
    match: fuzzy
  - keyword: "智能分析"
    match: fuzzy

# ---- 执行动作 ----
actions:
  - type: script
    path: ./scripts/handler.py
    handler: pay_handler
    input:
      query:
        type: string
        description: "文档路径或分析查询"
        required: true
      out_trade_no:
        type: string
        description: "支付后的订单号（重试时传入）"
        required: false
      payment_code:
        type: string
        description: "支付凭证码（重试时传入）"
        required: false

# ============================================================
# SkillPay 付费配置
# ============================================================
pay:
  enabled: true
  price:
    amount: 0.50                # ¥0.50 / 次
    currency: CNY
  billing:
    mode: per_call              # 按次计费
    min_balance: 5.00           # 最低预存 ¥5
  refund:
    policy: no_refund           # 正常执行不退
  trial:
    enabled: true
    calls: 3                    # 新用户 3 次免费
  x402:
    auth_mode: per_payment      # 默认笔笔确认

# ---- 安全声明 ----
security:
  content_review: true
  vulnerability_scan: true
  ai_safety_assessment: true

# ---- 调用鉴权 ----
auth:
  type: none
