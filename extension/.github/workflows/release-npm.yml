name: Build and Release (NPM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        
    - name: Debug environment
      run: |
        echo "Node.js version: $(node --version)"
        echo "npm version: $(npm --version)"
        echo "Current directory: $(pwd)"
        ls -la
        
    - name: Install dependencies with npm
      run: |
        rm -rf node_modules package-lock.json yarn.lock
        npm install
        
    - name: Build Chrome extension
      run: npm run build
      
    - name: Build Firefox extension
      run: npm run build:firefox
    
    - name: Create Chrome zip
      run: npm run zip
      
    - name: Create Firefox zip
      run: npm run zip:firefox
      
    - name: Get version from git tag
      id: package-version
      run: |
        git fetch --tags --force
        latest_tag=$(git describe --tags --abbrev=0)
        echo "version=${latest_tag#v}" >> "$GITHUB_OUTPUT"
        echo "tag=${latest_tag}" >> "$GITHUB_OUTPUT"
      
    - name: List zip files
      run: |
        echo "Extension files:"
        ls -la dist/
        echo "Looking for zip files:"
        find dist -name "*.zip" -type f
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.package-version.outputs.tag }}-npm
        name: Release ${{ steps.package-version.outputs.tag }} (NPM Build)
        body: |
          ## 🚀 ytb2bili Extension ${{ steps.package-version.outputs.tag }}
          
          **This is a manual NPM build release**
          
          ### ✨ 功能特性
          - 🎬 支持 YouTube 和 Bilibili 视频信息保存
          - 📝 自动获取视频字幕和元数据
          - 🔄 实时同步到后端服务
          - 🎯 智能视频检测和处理
          
          ### 📦 安装包说明
          - **Chrome 版本**: 兼容 Chromium 内核浏览器 (Chrome, Edge, 等)
          - **Firefox 版本**: 专为 Firefox 浏览器优化
          
        draft: false
        prerelease: true
        files: |
          dist/*.zip
        fail_on_unmatched_files: false