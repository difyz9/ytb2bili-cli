# ytb2bili-go 依赖配置
llm_api_key: "sk-489ee4c6456745d2b977a479c51207ef"
llm_base_url: "https://api.deepseek.com"
llm_model: "deepseek-v4-flash"
data_dir: "./data"
bili_tid: 122
translation_target_lang: zh-Hans

# 腾讯云 TTS 配置
tencent_cloud:
  secret_id: "AKIDCYuMk073oNs7GE1bEk3FJKDvPgjZEhw6"
  secret_key: "37zkMlz30pSvC4pNiqlTSxSr7B86zhFa"
  region: "ap-beijing"

# TTS 音频参数
tts:
  provider: "tencent"       # 合成器: tencent(腾讯云) / index(本地IndexTTS) / 空=自动检测
  voice_type: 101008        # 音色：101008-智琪(女声), 101007-智慧(女声), 101003-智云(男声)
  volume: 5                 # 音量：0-10
  speed: 1.0                # 语速：0.6-1.5
  primary_language: 1       # 主语言：1-中文，2-英文
  sample_rate: 16000        # 采样率
  codec: "mp3"              # 编码格式

# 并发处理配置
concurrent:
  max_workers: 5            # 最大并发数
  rate_limit: 20            # 每秒请求限制
  batch_size: 10            # 批处理大小

# 转录后端配置
transcriber:
  provider: whisper          # bcut(云ASR) | whisper(本地whisper.cpp)
  whisper:
    binary: whisper-cli      # whisper-cli 可执行路径（按 PATH 查找）
    model: models/ggml-base.bin   # GGML 模型文件路径
    threads: 4               # 推理线程数
