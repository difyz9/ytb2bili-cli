# 腾讯云 TTS 配置
tencent_cloud:
  secret_id: "AKIDCYuMk073oNs7GE1bEk3FJKDvPgjZEhw6"
  secret_key: "37zkMlz30pSvC4pNiqlTSxSr7B86zhFa"
  region: "ap-beijing"

# 多翻译服务配置（Phase 1：DeepSeek 主 + 腾讯/百度降级）
# primary 主服务；fallbacks 降级顺序（DeepSeek 高峰限流时自动切换）
translation:
  primary: "deepseek"          # 主服务: deepseek / baidu / tencent
  fallbacks: ["tencent"]       # 降级顺序（可多级: ["tencent", "baidu"]）
  retries: 2                   # 主服务失败重试次数
  deepseek:
    api_key: "${DEEPSEEK_API_KEY}"   # 留空则用顶层 llm_api_key
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    batch_size: 15             # 批大小（调低规避限流截断）
    context_size: 2
  baidu:                       # 百度翻译（需自行申请: https://api.fanyi.baidu.com）
    app_id: ""
    app_key: ""
    qps: 1                     # 百度免费版 QPS=1
  tencent:                     # 腾讯翻译（留空自动复用 tencent_cloud 凭证）
    secret_id: ""
    secret_key: ""
    region: "ap-beijing"

# YouTube OAuth 授权配置（ytb yt-oauth login 使用）
# 在 Google Cloud Console → APIs & Services → Credentials 创建 OAuth 2.0 客户端
# 应用类型选 "桌面应用" 或 "TV and Limited Input devices"（支持设备码流程）
youtube_oauth:
  client_id: "1008031090416-4ddm2v3t8n3hh1dvksoeds009p4phpk3.apps.googleusercontent.com"       # 你的 Google OAuth Client ID
  client_secret: "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"   # 你的 Google OAuth Client Secret

# TTS 音频参数
tts:
  provider: "tencent"       # 合成器: tencent(腾讯云) / index(本地IndexTTS) / 空=自动检测
  voice_type: 502005        # 腾讯云音色：101008-智琪(女声), 101007-智慧(女声), 101003-智云(男声)
  volume: 5                 # 音量：0-10
  speed: 1.0                # 语速：0.6-1.5
  primary_language: 1       # 主语言：1-中文，2-英文
  sample_rate: 16000        # 采样率
  codec: "mp3"              # 编码格式
  # 本地 IndexTTS2 服务配置（provider: "index" 时生效）
  index:
    api_url: "http://localhost:18765"   # IndexTTS2 HTTP 服务地址
    emotion: "default"                  # 情感预设: default/happy/angry/sad/excited
    emotion_alpha: 0.6                  # 情感强度 0-1
    ref_audio: ""                       # 参考音频路径（服务端可见，用于语音克隆音色）
    use_emo_text: false                 # 是否使用文本情感描述
    emo_text: ""                        # 文本情感描述（use_emo_text=true 时生效）
    concurrency: 1                      # 并发合成数
    retries: 3                          # 失败重试次数
    timeout: 180                        # 单条请求超时秒数

# 并发处理配置
concurrent:
  max_workers: 5            # 最大并发数
  rate_limit: 20            # 每秒请求限制
  batch_size: 10            # 批处理大小

# 转录后端配置
transcriber:
  provider: whisper          # bcut(云ASR) | whisper(本地whisper.cpp)
  whisper:
    binary: whisper-cli      # whisper-cli 可执行路径（按 PATH 查找）
    model: ~/.biliup/models/ggml-base.bin   # GGML 模型文件路径（支持 ~/ 展开）
    threads: 4               # 推理线程数
